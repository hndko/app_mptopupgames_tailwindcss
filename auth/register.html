<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - MPTopUp</title>
    <meta name="description" content="Daftar akun MPTopUp untuk kemudahan transaksi, diskon khusus member, dan poin reward.">
    <!-- Local Compiled Tailwind CSS & FontAwesome (No CDN) -->
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-sky-500 selection:text-white">

    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl grid grid-cols-1 lg:grid-cols-12">
        <!-- Left Side: Graphic Hero Banner -->
        <div class="hidden lg:flex lg:col-span-5 bg-slate-950 items-center justify-center p-6 border-r border-slate-800 relative overflow-hidden">
            <img src="../assets/images/auth/auth-banner.svg" alt="MPTopUp Gaming" class="w-full h-full object-contain">
        </div>

        <!-- Right Side: Register Form -->
        <div class="lg:col-span-7 p-6 sm:p-10 flex flex-col justify-between space-y-6">
            <div class="space-y-2">
                <a href="../index.html" class="inline-flex items-center gap-2.5 group focus-visible:rounded-lg mb-2">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 to-sky-500 border border-sky-400/40 flex items-center justify-center text-white shadow-md shadow-sky-500/20 group-hover:scale-105 transition-transform">
                        <span class="font-black text-lg tracking-tighter text-sky-400">M<span class="text-white">P</span></span>
                    </div>
                    <span class="text-2xl font-black tracking-tight text-white">MP<span class="text-sky-400">TopUp</span></span>
                </a>
                <h1 class="text-2xl font-extrabold text-white">Buat Akun Baru</h1>
                <p class="text-xs sm:text-sm text-slate-400">Dapatkan keuntungan promo cashback, voucher diskon, dan pelacakan instan.</p>
            </div>

            <!-- Form -->
            <form action="login.html" method="GET" class="space-y-3.5">
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="text" id="name" name="name" required placeholder="Nama Anda"
                            class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-300 mb-1">Alamat Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="email" id="email" name="email" required placeholder="nama@email.com"
                            class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>

                <div>
                    <label for="whatsapp" class="block text-xs font-semibold text-slate-300 mb-1">Nomor WhatsApp</label>
                    <div class="relative">
                        <i class="fab fa-whatsapp absolute left-3.5 top-3.5 text-emerald-400 text-sm pointer-events-none"></i>
                        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="081234567890"
                            class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="password" id="password" name="password" required placeholder="Minimal 8 karakter"
                            class="w-full h-11 pl-10 pr-10 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="terms" required class="rounded bg-slate-800 border-slate-700 text-sky-600 focus:ring-sky-500">
                    <label for="terms" class="text-xs text-slate-400">Saya menyetujui Syarat &amp; Ketentuan Layanan</label>
                </div>

                <button type="submit"
                    class="w-full h-11 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-sky-600/20 transition-colors">
                    <i class="fas fa-user-plus text-xs"></i> Buat Akun MPTopUp
                </button>
            </form>

            <p class="text-center text-xs text-slate-400 pt-2">
                Sudah memiliki akun? <a href="login.html" class="font-bold text-sky-400 hover:text-sky-300">Masuk di sini</a>
            </p>
        </div>
    </div>
</body>

</html>
