<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - MPTopUp</title>
    <meta name="description" content="Daftar akun MPTopUp untuk kemudahan top up game, voucher diskon, dan lacak pesanan.">
    <!-- Local Compiled Tailwind CSS & FontAwesome (No CDN) -->
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-sky-500 selection:text-white">
    <!-- Gaming Background with Scrim -->
    <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="absolute inset-0 z-0 bg-slate-950/90"></div>

    <div class="relative z-10 w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <a href="../index.html" class="inline-flex items-center gap-2.5 group focus-visible:rounded-lg">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 to-sky-500 border border-sky-400/40 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <span class="font-black text-lg tracking-tighter text-sky-400">M<span class="text-white">P</span></span>
                </div>
                <span class="text-2xl font-black tracking-tight text-white">MP<span class="text-sky-400">TopUp</span></span>
            </a>
            <h1 class="text-xl font-bold text-white pt-2">Buat Akun Member</h1>
            <p class="text-xs sm:text-sm text-slate-400">Dapatkan kupon promo khusus dan kemudahan lacak transaksi.</p>
        </div>

        <!-- Form -->
        <form action="login.html" method="GET" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="fullname" class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="text" id="fullname" name="fullname" required placeholder="Nama Anda"
                            class="w-full h-11 pl-10 pr-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div>
                    <label for="whatsapp" class="block text-xs font-semibold text-slate-300 mb-1">Nomor WhatsApp</label>
                    <div class="relative">
                        <i class="fab fa-whatsapp absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="08123456789"
                            class="w-full h-11 pl-10 pr-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 mb-1">Alamat Email</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                    <input type="email" id="email" name="email" required placeholder="nama@email.com"
                        class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="password" id="password" name="password" required placeholder="Minimal 8 karakter"
                            class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-xs font-semibold text-slate-300 mb-1">Ulangi Sandi</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi kata sandi"
                            class="w-full h-11 pl-10 pr-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>
            </div>

            <div class="flex items-start gap-2.5 pt-1">
                <input id="terms" type="checkbox" required
                    class="mt-1 w-4 h-4 rounded border-slate-700 bg-slate-800 text-sky-600 focus:ring-sky-500">
                <label for="terms" class="text-xs text-slate-400 leading-normal">
                    Saya menyetujui <span class="text-sky-400">Syarat & Ketentuan Layanan</span> serta kebijakan privasi data.
                </label>
            </div>

            <button type="submit"
                class="w-full h-11 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-sky-600/20 transition-colors">
                <i class="fas fa-user-plus text-xs"></i> Buat Akun Sekarang
            </button>
        </form>

        <p class="text-center text-xs text-slate-400">
            Sudah memiliki akun? <a href="login.html" class="font-bold text-sky-400 hover:text-sky-300">Masuk di sini</a>
        </p>
    </div>
</body>

</html>
