<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="fullLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="fullLogoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sparkGoldFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#fullLogoBg)" stroke="url(#fullLogoBorder)" stroke-width="2.5"/>
    <ellipse cx="34" cy="16" rx="24" ry="10" fill="#ffffff" opacity="0.25"/>
    <text x="14" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="-1">M</text>
    <text x="38" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="30" fill="#38bdf8" letter-spacing="-1">P</text>
    <!-- Spark -->
    <polygon points="56,10 58,15 63,16 58,18 56,23 54,18 49,16 54,15" fill="url(#sparkGoldFull)"/>
  </g>

  <!-- Right Typography -->
  <text x="90" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="-0.5">
    MP<tspan fill="#38bdf8">TopUp</tspan>
  </text>
</svg>
