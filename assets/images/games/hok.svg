<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="hokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a10"/>
      <stop offset="50%" stop-color="#2d0f17"/>
      <stop offset="100%" stop-color="#0d0407"/>
    </linearGradient>
    <linearGradient id="hokGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="hokCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="hokGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#hokBg)"/>
  
  <circle cx="300" cy="280" r="180" fill="#f43f5e" opacity="0.1" filter="url(#hokGlow)"/>

  <!-- King's Crown & Token Emblem -->
  <g transform="translate(300, 280)">
    <!-- Dragon Horn Crest / Outer Shield -->
    <path d="M 0,-120 L 70,-40 L 95,40 L 0,120 L -95,40 L -70,-40 Z" fill="#240e15" stroke="url(#hokGold)" stroke-width="5" filter="url(#hokGlow)"/>
    
    <!-- Royal Crown -->
    <path d="M -60,20 L -70,-50 L -30,-20 L 0,-70 L 30,-20 L 70,-50 L 60,20 Z" fill="url(#hokGold)"/>
    
    <!-- Central Red Gem -->
    <polygon points="0,-15 25,15 0,45 -25,15" fill="url(#hokCrimson)"/>
    <circle cx="0" cy="15" r="8" fill="#fef08a"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-80" y="-30" width="160" height="26" rx="6" fill="#f43f5e" opacity="0.25"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#fb7185" letter-spacing="3">GLOBAL MOBA</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="2">HONOR OF KINGS</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="url(#hokGold)" letter-spacing="4">TOKONS &amp; PASS</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">Tencent Games &bull; Top Up Token Resmi</text>
  </g>
</svg>
