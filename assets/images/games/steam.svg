<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="steamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171a21"/>
      <stop offset="50%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0a1017"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1999ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#steamBg)"/>
  
  <circle cx="300" cy="280" r="180" fill="#1999ff" opacity="0.1" filter="url(#steamGlow)"/>

  <!-- Steam Piston & Gear Emblem -->
  <g transform="translate(300, 280)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2a475e" stroke-width="8"/>
    <circle cx="0" cy="0" r="100" fill="url(#steamGrad)" opacity="0.2"/>

    <!-- Steam Piston / Connecting Rod -->
    <!-- Large Axis/Bearing -->
    <circle cx="35" cy="-25" r="42" fill="#c7d5e0"/>
    <circle cx="35" cy="-25" r="28" fill="#171a21"/>
    
    <!-- Arm / Rod -->
    <path d="M 35,-25 L -45,45 L -65,30 L 15,-40 Z" fill="#c7d5e0"/>
    
    <!-- Small Bearing -->
    <circle cx="-45" cy="45" r="28" fill="#c7d5e0"/>
    <circle cx="-45" cy="45" r="16" fill="#171a21"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-70" y="-30" width="140" height="26" rx="6" fill="#1999ff" opacity="0.25"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#66c0f4" letter-spacing="3">PC VOUCHER</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">STEAM WALLET</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#66c0f4" letter-spacing="4">CODE IDR RESMI</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">Valve Corporation &bull; Kode Instan Otomatis</text>
  </g>
</svg>
