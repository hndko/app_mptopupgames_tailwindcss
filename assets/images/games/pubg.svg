<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pubgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a15"/>
      <stop offset="50%" stop-color="#1b241d"/>
      <stop offset="100%" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="pubgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="pubgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#pubgBg)"/>
  
  <circle cx="300" cy="280" r="180" fill="#f59e0b" opacity="0.08" filter="url(#pubgGlow)"/>

  <!-- Level 3 Helmet Silhouette -->
  <g transform="translate(300, 280)">
    <!-- Helmet Dome -->
    <path d="M -80,-30 C -80,-110 80,-110 80,-30 L 80,40 C 80,70 50,90 0,90 C -50,90 -80,70 -80,40 Z" fill="#262e28" stroke="url(#pubgGold)" stroke-width="5"/>
    
    <!-- Helmet Visor / Face Shield -->
    <rect x="-65" y="-15" width="130" height="35" rx="6" fill="#0f1411" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Visor Slits -->
    <line x1="-50" y1="2" x2="50" y2="2" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-40" y1="-5" x2="40" y2="-5" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-40" y1="9" x2="40" y2="9" stroke="#f59e0b" stroke-width="2"/>

    <!-- Ear Guards -->
    <rect x="-85" y="-10" width="10" height="40" rx="3" fill="#f59e0b"/>
    <rect x="75" y="-10" width="10" height="40" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-80" y="-30" width="160" height="26" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#fbbf24" letter-spacing="3">SURVIVAL BATTLE</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="3">PUBG MOBILE</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="url(#pubgGold)" letter-spacing="4">UNKNOWN CASH (UC)</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">Level Infinite &bull; Top Up UC Resmi</text>
  </g>
</svg>
