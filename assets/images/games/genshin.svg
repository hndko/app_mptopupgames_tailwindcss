<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="giBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111836"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d1f"/>
    </linearGradient>
    <linearGradient id="primoStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="giGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="giGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#giBg)"/>
  
  <!-- Magic Aura -->
  <circle cx="300" cy="280" r="190" fill="#818cf8" opacity="0.12" filter="url(#giGlow)"/>

  <!-- Celestial Constellation Rings -->
  <circle cx="300" cy="280" r="130" fill="none" stroke="url(#giGold)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>
  <circle cx="300" cy="280" r="155" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Primogem / Crystal Emblem -->
  <g transform="translate(300, 280) scale(1.15)">
    <!-- Four-Pointed Primogem Star -->
    <path d="M 0,-100 Q 15,-20 90,0 Q 15,20 0,100 Q -15,20 -90,0 Q -15,-20 0,-100 Z" fill="url(#primoStar)" filter="url(#giGlow)"/>
    <!-- Facet Inner Lines -->
    <polygon points="0,-100 20,-10 0,0 -20,-10" fill="#ffffff" opacity="0.6"/>
    <polygon points="90,0 10,20 0,0 10,-20" fill="#a5b4fc" opacity="0.5"/>
    <polygon points="0,100 -20,10 0,0 20,10" fill="#38bdf8" opacity="0.6"/>
    <polygon points="-90,0 -10,-20 0,0 -10,20" fill="#f472b6" opacity="0.5"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-85" y="-30" width="170" height="26" rx="6" fill="#818cf8" opacity="0.25"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#c7d2fe" letter-spacing="3">OPEN-WORLD RPG</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="2">GENSHIN IMPACT</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="url(#giGold)" letter-spacing="3">GENESIS CRYSTALS &amp; WELKIN</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">HoYoverse &bull; Top Up Server Asia / Global</text>
  </g>
</svg>
