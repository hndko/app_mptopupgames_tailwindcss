<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="50%" stop-color="#2a1a0c"/>
      <stop offset="100%" stop-color="#0e0702"/>
    </linearGradient>
    <linearGradient id="ffFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#ffBg)"/>
  
  <!-- Aura & Flame Rings -->
  <circle cx="300" cy="280" r="190" fill="#ea580c" opacity="0.12" filter="url(#ffGlow)"/>
  <circle cx="300" cy="280" r="140" fill="#fde047" opacity="0.08" filter="url(#ffGlow)"/>

  <!-- Flame & Knife / FF Shield Emblem -->
  <g transform="translate(300, 280)">
    <!-- Outer Flame Crest -->
    <path d="M 0,-120 Q 70,-70 90,20 Q 110,100 0,140 Q -110,100 -90,20 Q -70,-70 0,-120 Z" fill="url(#ffFire)" filter="url(#ffGlow)"/>
    
    <!-- Inner Dark Shield -->
    <path d="M 0,-95 Q 55,-55 70,15 Q 85,80 0,115 Q -85,80 -70,15 Q -55,-55 0,-95 Z" fill="#18181b"/>
    
    <!-- FF Golden Wings and Knife -->
    <path d="M -50,-20 L 0,-80 L 50,-20 L 25,60 L 0,85 L -25,60 Z" fill="url(#ffFire)"/>
    <!-- Yellow Core -->
    <polygon points="0,-50 20,-10 0,45 -20,-10" fill="#fef08a"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-85" y="-30" width="170" height="26" rx="6" fill="#ea580c" opacity="0.25"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#fb923c" letter-spacing="3">BATTLE ROYALE</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3">FREE FIRE</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="url(#ffFire)" letter-spacing="4">DIAMONDS &amp; PASS</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">Garena &#8226; Top Up Cepat Otomatis</text>
  </g>
</svg>
