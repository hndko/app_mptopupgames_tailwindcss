<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="4"/>

  <!-- Subtle Inner Lighting -->
  <ellipse cx="64" cy="28" rx="42" ry="18" fill="#ffffff" opacity="0.25"/>

  <!-- MP Bold Monogram -->
  <g transform="translate(64, 76)">
    <!-- Letter M -->
    <path d="M -44,14 L -44,-36 L -27,-36 L -16,-8 L -5,-36 L 12,-36 L 12,14 L -1,14 L -1,-14 L -11,10 L -21,10 L -31,-14 L -31,14 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    
    <!-- Letter P -->
    <path d="M 17,14 L 17,-36 L 35,-36 C 45,-36 50,-30 50,-21 C 50,-12 45,-6 35,-6 L 29,-6 L 29,14 Z M 29,-18 L 34,-18 C 38,-18 40,-19 40,-21 C 40,-23 38,-24 34,-24 L 29,-24 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Gaming Diamond Spark / Top Right Accent -->
  <g transform="translate(100, 26)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#sparkGold)" filter="url(#logoGlow)"/>
  </g>
</svg>
