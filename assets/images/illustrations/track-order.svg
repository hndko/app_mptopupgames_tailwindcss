<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="tcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="20" fill="url(#tbg)"/>

  <circle cx="650" cy="120" r="100" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="100" cy="80" r="80" fill="#38bdf8" opacity="0.08"/>

  <!-- Left Text Details -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.2"/>
    <text x="14" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="2">⚡ PELACAKAN LIVE</text>
    <text x="0" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#ffffff">Pantau Status Pesanan Kamu</text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">Cek nomor pesanan (#MPxxxxxx) atau nomor WhatsApp untuk melihat bukti pengiriman.</text>
  </g>

  <!-- Right Graphic (Magnifier & Receipt) -->
  <g transform="translate(650, 120)">
    <!-- Receipt Card Mockup -->
    <rect x="-40" y="-55" width="80" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="-15" x2="15" y2="-15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="0" x2="20" y2="0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="15" x2="0" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="35" r="8" fill="#10b981"/>

    <!-- Magnifier Lens -->
    <circle cx="-10" cy="15" r="28" fill="#0f172a" fill-opacity="0.8" stroke="url(#tcyan)" stroke-width="4"/>
    <line x1="10" y1="35" x2="32" y2="57" stroke="url(#tcyan)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
