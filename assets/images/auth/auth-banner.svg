<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0c1938"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="acyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="agold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="aglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#abg)"/>

  <!-- Glowing background elements -->
  <circle cx="300" cy="340" r="220" fill="#0ea5e9" opacity="0.15" filter="url(#aglow)"/>
  <circle cx="450" cy="180" r="140" fill="#38bdf8" opacity="0.1" filter="url(#aglow)"/>
  <circle cx="150" cy="550" r="160" fill="#eab308" opacity="0.08" filter="url(#aglow)"/>

  <!-- Hexagonal & Grid Tech Pattern -->
  <path d="M 0,100 L 600,100" stroke="#0ea5e9" stroke-width="1" opacity="0.1" stroke-dasharray="6 10"/>
  <path d="M 0,700 L 600,700" stroke="#0ea5e9" stroke-width="1" opacity="0.1" stroke-dasharray="6 10"/>

  <!-- Main Illustration: Gamepad & Diamond Shield Emblem -->
  <g transform="translate(300, 320)">
    <!-- Tech Outer Shield -->
    <path d="M 0,-160 L 150,-70 L 110,110 L 0,180 L -110,110 L -150,-70 Z" fill="#0f172a" stroke="url(#acyan)" stroke-width="6" filter="url(#aglow)"/>

    <!-- Controller Body -->
    <path d="M -80,-30 C -80,-70 80,-70 80,-30 C 95,20 110,90 75,100 C 50,105 35,60 0,60 C -35,60 -50,105 -75,100 C -110,90 -95,20 -80,-30 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>

    <!-- D-Pad (Left) -->
    <rect x="-60" y="-15" width="20" height="8" rx="2" fill="#38bdf8"/>
    <rect x="-54" y="-21" width="8" height="20" rx="2" fill="#38bdf8"/>

    <!-- Action Buttons (Right) -->
    <circle cx="45" cy="-11" r="4" fill="#f43f5e"/>
    <circle cx="59" cy="-11" r="4" fill="#38bdf8"/>
    <circle cx="52" cy="-18" r="4" fill="#fde047"/>
    <circle cx="52" cy="-4" r="4" fill="#10b981"/>

    <!-- Central Diamond Gem -->
    <polygon points="0,-40 25,-10 0,30 -25,-10" fill="url(#agold)" filter="url(#aglow)"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(300, 570)" text-anchor="middle">
    <!-- Brand Title -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1">
      MP<tspan fill="#38bdf8">TopUp</tspan>
    </text>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="url(#agold)" letter-spacing="3">
      PORTAL GAMING TERPERCAYA
    </text>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
      Akses riwayat transaksi, promo eksklusif member,
    </text>
    <text x="0" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
      dan penawaran voucher game terbaik setiap hari.
    </text>
  </g>
</svg>
