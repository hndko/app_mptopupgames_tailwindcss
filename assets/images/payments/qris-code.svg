<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="qbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#qbg)" stroke="#e2e8f0" stroke-width="4"/>

  <!-- QRIS Header -->
  <rect x="30" y="25" width="340" height="45" rx="8" fill="#c0262d"/>
  <text x="200" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">QRIS BEBAS BIAYA</text>

  <!-- QR Code Matrix Simulation -->
  <g transform="translate(60, 95)">
    <!-- Corner Box Top Left -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="14" y="14" width="42" height="42" rx="4" fill="#ffffff"/>
    <rect x="24" y="24" width="22" height="22" rx="2" fill="#0f172a"/>

    <!-- Corner Box Top Right -->
    <rect x="210" y="0" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="224" y="14" width="42" height="42" rx="4" fill="#ffffff"/>
    <rect x="234" y="24" width="22" height="22" rx="2" fill="#0f172a"/>

    <!-- Corner Box Bottom Left -->
    <rect x="0" y="170" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="14" y="184" width="42" height="42" rx="4" fill="#ffffff"/>
    <rect x="24" y="194" width="22" height="22" rx="2" fill="#0f172a"/>

    <!-- Inner Data Pixels -->
    <rect x="90" y="10" width="16" height="35" rx="3" fill="#0f172a"/>
    <rect x="120" y="0" width="30" height="18" rx="3" fill="#0f172a"/>
    <rect x="170" y="15" width="20" height="40" rx="3" fill="#0f172a"/>

    <rect x="90" y="70" width="40" height="20" rx="3" fill="#0f172a"/>
    <rect x="150" y="70" width="25" height="35" rx="3" fill="#0f172a"/>
    <rect x="195" y="85" width="40" height="20" rx="3" fill="#0f172a"/>

    <!-- Center Logo Badge -->
    <circle cx="140" cy="120" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <text x="140" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#38bdf8" text-anchor="middle">MP</text>

    <!-- Bottom Matrix Pixels -->
    <rect x="90" y="180" width="25" height="45" rx="3" fill="#0f172a"/>
    <rect x="135" y="170" width="35" height="20" rx="3" fill="#0f172a"/>
    <rect x="190" y="150" width="45" height="25" rx="3" fill="#0f172a"/>
    <rect x="220" y="195" width="60" height="30" rx="3" fill="#0f172a"/>
  </g>

  <!-- Scan Instruction -->
  <text x="200" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#64748b" text-anchor="middle">Scan dengan Semua Aplikasi Pembayaran / Bank</text>
</svg>
