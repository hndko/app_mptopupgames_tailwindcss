<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hbg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329"/>
      <stop offset="50%" stop-color="#191942"/>
      <stop offset="100%" stop-color="#070a17"/>
    </linearGradient>
    <linearGradient id="hpurp3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hgold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="hglow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#hbg3)"/>
  
  <circle cx="950" cy="240" r="280" fill="#818cf8" opacity="0.18" filter="url(#hglow3)"/>
  <circle cx="200" cy="400" r="200" fill="#38bdf8" opacity="0.1" filter="url(#hglow3)"/>

  <!-- Left Content Info -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <text x="22" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#a5b4fc" letter-spacing="2">✨ GENSHIN &amp; VOUCHER</text>

    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff">BLESSING OF WELKIN MOON</text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#hgold3)">DISKON POTONGAN SPESIAL</text>

    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="18" fill="#94a3b8">
      Top up Genesis Crystals &amp; Welkin Moon aman 100% via UID Server Asia.
    </text>

    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="220" height="52" rx="14" fill="url(#hpurp3)" filter="url(#hglow3)"/>
      <rect x="0" y="0" width="220" height="52" rx="14" fill="url(#hpurp3)"/>
      <text x="110" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="1">AMBIL PROMO &rarr;</text>
    </g>
  </g>

  <!-- Right Graphic Illustration (Primogem Star) -->
  <g transform="translate(950, 240) scale(1.3)">
    <path d="M 0,-110 Q 18,-25 100,0 Q 18,25 0,110 Q -18,25 -100,0 Q -18,-25 0,-110 Z" fill="url(#hpurp3)" filter="url(#hglow3)"/>
    <polygon points="0,-110 25,-12 0,0 -25,-12" fill="#ffffff" opacity="0.6"/>
    <polygon points="100,0 12,25 0,0 12,-25" fill="#a5b4fc" opacity="0.5"/>
    <polygon points="0,110 -25,12 0,0 25,12" fill="#38bdf8" opacity="0.6"/>
    <polygon points="-100,0 -12,-25 0,0 -12,25" fill="#f472b6" opacity="0.5"/>
  </g>
</svg>
