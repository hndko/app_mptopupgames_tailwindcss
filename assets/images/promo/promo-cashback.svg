<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#cbg)"/>
  <circle cx="200" cy="180" r="120" fill="#10b981" opacity="0.1"/>

  <!-- Cashback Wallet / Coin Icon -->
  <g transform="translate(200, 160)">
    <circle cx="0" cy="0" r="50" fill="url(#cgold)"/>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="#064e3b" text-anchor="middle">%</text>
  </g>

  <text x="200" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#ffffff">CASHBACK 25%</text>
  <text x="200" y="305" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="url(#cgold)" letter-spacing="2">SEMUA GAME</text>
  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#34d399">KODE: MEGA25</text>
</svg>
