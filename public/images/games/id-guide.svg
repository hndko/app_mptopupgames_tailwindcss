<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="16" fill="url(#gbg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Profile Mockup -->
  <circle cx="90" cy="90" r="45" fill="#1e293b" stroke="#0ea5e9" stroke-width="3"/>
  <text x="90" y="98" font-family="sans-serif" font-size="28" fill="#38bdf8" text-anchor="middle">👤</text>
  
  <rect x="160" y="60" width="180" height="18" rx="6" fill="#334155"/>
  <rect x="160" y="90" width="120" height="14" rx="4" fill="#1e293b"/>
  
  <!-- ID Box Highlight -->
  <rect x="50" y="160" width="500" height="110" rx="12" fill="#0f2238" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 6"/>
  
  <text x="75" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">User ID Game :</text>
  <rect x="180" y="180" width="160" height="32" rx="8" fill="#0369a1"/>
  <text x="260" y="202" font-family="monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">12345678</text>
  
  <text x="360" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">Server/Zone :</text>
  <rect x="460" y="180" width="75" height="32" rx="8" fill="#0284c7"/>
  <text x="497" y="202" font-family="monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">(2024)</text>
  
  <text x="300" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">
    💡 Angka di dalam tanda kurung adalah Server / Zone ID Anda
  </text>
</svg>
