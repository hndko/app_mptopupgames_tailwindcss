<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="gpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="gpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#gpBg)"/>
  
  <circle cx="300" cy="280" r="180" fill="#0ea5e9" opacity="0.08" filter="url(#gpGlow)"/>

  <!-- Google Play 4-Color Triangle Logo -->
  <g transform="translate(300, 280) scale(1.4)">
    <!-- Base Rounded Triangle / Clip or Segments -->
    <!-- Blue Triangle (Left Base) -->
    <path d="M -50,-80 L 10,-20 L -50,40 Z" fill="#00d6ff"/>
    
    <!-- Green Polygon (Top) -->
    <path d="M -50,-80 L 40,0 L 10,-20 Z" fill="#00e676"/>
    
    <!-- Yellow Triangle (Right Point) -->
    <path d="M 10,-20 L 40,0 L 10,20 Z" fill="#ffeb3b"/>
    
    <!-- Red Polygon (Bottom) -->
    <path d="M -50,40 L 10,20 L 40,0 Z" fill="#ff3d00"/>
    
    <!-- Left Base Shadow/Curve -->
    <path d="M -50,-80 L 10,-20 L 10,20 L -50,40 Z" fill="#00c0f0" opacity="0.9"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-80" y="-30" width="160" height="26" rx="6" fill="#0ea5e9" opacity="0.2"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#38bdf8" letter-spacing="3">DIGITAL CODE</text>

    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">GOOGLE PLAY</text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="4">VOUCHER IDR</text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">Google LLC &#8226; Kode Resmi Saldo Play Store</text>
  </g>
</svg>
