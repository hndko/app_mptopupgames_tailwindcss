<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0f224a"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="hcyan1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="hgold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="hglow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="28" fill="url(#hbg1)"/>
  
  <!-- Aura Gradients -->
  <circle cx="950" cy="240" r="280" fill="#0ea5e9" opacity="0.18" filter="url(#hglow1)"/>
  <circle cx="1100" cy="120" r="180" fill="#eab308" opacity="0.12" filter="url(#hglow1)"/>
  <circle cx="150" cy="400" r="220" fill="#0284c7" opacity="0.1" filter="url(#hglow1)"/>

  <!-- Grid Tech Lines -->
  <path d="M 0,240 L 1200,240" stroke="#38bdf8" stroke-width="1" opacity="0.15" stroke-dasharray="8 12"/>
  <path d="M 800,0 L 1200,480" stroke="#38bdf8" stroke-width="1" opacity="0.15" stroke-dasharray="8 12"/>

  <!-- Left Content Info -->
  <g transform="translate(80, 110)">
    <!-- Event Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="22" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#38bdf8" letter-spacing="2">⚡ EVENT SPESIAL MLBB</text>

    <!-- Main Headline -->
    <text x="0" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff">TOP UP DIAMONDS INSTAN</text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#hgold1)">CASHBACK HINGGA 20%</text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="18" fill="#94a3b8">
      Proses kilat 1-3 detik otomatis masuk ke ID Mobile Legends kamu.
    </text>

    <!-- CTA Button Pill inside SVG -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="220" height="52" rx="14" fill="url(#hcyan1)" filter="url(#hglow1)"/>
      <rect x="0" y="0" width="220" height="52" rx="14" fill="url(#hcyan1)"/>
      <text x="110" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="1">TOP UP SEKARANG &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic Illustration (MLBB Diamond Crest & Shield) -->
  <g transform="translate(950, 240)">
    <!-- Outer Shield Crest -->
    <path d="M 0,-140 L 120,-60 L 80,90 L 0,150 L -80,90 L -120,-60 Z" fill="#0f172a" stroke="url(#hgold1)" stroke-width="8" filter="url(#hglow1)"/>
    
    <!-- Wings Background -->
    <path d="M -180,-30 Q -100,-150 0,-90 Q 100,-150 180,-30 Q 80,-40 0,70 Q -80,-40 -180,-30 Z" fill="url(#hgold1)" opacity="0.9"/>
    
    <!-- Inner Diamond Gem -->
    <polygon points="0,-80 65,-25 0,90 -65,-25" fill="url(#hcyan1)" filter="url(#hglow1)"/>
    <polygon points="0,-80 65,-25 0,15 -65,-25" fill="#e0f2fe" opacity="0.6"/>
    <polygon points="0,-80 0,90 65,-25" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>
